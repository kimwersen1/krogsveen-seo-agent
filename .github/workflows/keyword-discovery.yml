name: Bi-ukentlig søkeordsoppdagelse og innholdsforslag

# To ganger i måneden (1. og 15., 06:00 UTC) — cron har ingen "hver 14. dag"-primitiv,
# så dette er den vanlige tilnærmingen til bi-ukentlig kadence. Skriver funn + Claude-
# genererte artikkelforslag til det løpende Drive-dokumentet (--to-drive). Kostnad:
# typisk 12 000-16 000 Ahrefs-enheter per kjøring (alle 8 konkurrenter) — under 35 %
# av månedlig kvote selv med to kjøringer/måned.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1,15 * *"

permissions:
  contents: write # trengs for å committe data/history.db tilbake til repoet, se under

jobs:
  keyword-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Skriv service account-nøkkel til fil
        run: |
          mkdir -p credentials
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT_B64" | base64 -d > credentials/service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT_B64 }}

      - name: Kjør søkeordsoppdagelse
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
          AHREFS_PROJECT_ID: ${{ secrets.AHREFS_PROJECT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: credentials/service-account.json
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: python scripts/keyword_discovery.py --to-drive

      - name: Commit oppdatert historikk og dashboard
        # Uten dette skriver scripts/keyword_discovery.py sin
        # storage.save_content_briefs_meta() til den ephemeral runnerens lokale
        # data/history.db, som forsvinner når jobben avsluttes — dashboardets
        # "sist oppdatert"-dato for innholdsforslag stod dermed fast på 21.07.2026
        # i ukesvis, uavhengig av at selve Drive-dokumentet faktisk ble oppdatert
        # riktig hver gang (bekreftet 18.08.2026: Doc-en var reelt oppdatert
        # 15.08, men historikken/dashboardet visste det aldri). Samme mønster
        # som weekly-report.yml sin tilsvarende steg. docs/index.html er lagt til
        # her fordi scripts/keyword_discovery.py nå også patcher innholdsforslag-
        # kortet direkte (dashboard.update_content_briefs_section()) i stedet for
        # å vente på neste mandags fulle pipeline-kjøring.
        run: |
          git config user.name "krogsveen-seo-agent"
          git config user.email "actions@github.com"
          git add data/history.db docs/index.html
          git diff --staged --quiet && echo "Ingen endringer å committe" || git commit -m "Oppdater innholdsforslag-historikk og dashboard"
          git push
